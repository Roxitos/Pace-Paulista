name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-e-testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Mesma imagem do docker-compose.yml (Debian, por causa da collation).
      db:
        image: postgres:16
        env:
          POSTGRES_USER: pace
          POSTGRES_PASSWORD: pace
          POSTGRES_DB: pace_paulista_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pace -d pace_paulista_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    # Sem .env: o env.js usa os padrões de dev (localhost, pace/pace) e os testes
    # usam pace_paulista_test, o banco criado pelo service acima.

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
